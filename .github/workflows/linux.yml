name: linux

on:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'
  pull_request:

jobs:
  perl:

    runs-on: ubuntu-latest

    env:
       PERL_USE_UNSAFE_INC: 0
       AUTHOR_TESTING: 1
       AUTOMATED_TESTING: 1
       RELEASE_TESTING: 1
       PERL_CARTON_PATH: $GITHUB_WORKSPACE/local

    strategy:
      fail-fast: false
      matrix:
        perl-version:
          - '5.42'
          - '5.40'
          - '5.36'
          - '5.32'
          - '5.30'
          - '5.28'
          - '5.26'
          - '5.24'
          - '5.22'
          - '5.20'
          - '5.18'
          - '5.16'
          - '5.14'
          - '5.12'
          - '5.10'
          - '5.8'
        include:
          - perl-version: '5.42'
            coverage: true

    container:
      image: perldocker/perl-tester:${{ matrix.perl-version }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: submodule init
        run: git submodule init
      - name: submodule update
        run: git submodule update
      - name: perl -V
        run: perl -V
      - name: Install Dependencies
        run: cpanm --notest --installdeps .
      - name: perl Makefile.PL
        run: perl Makefile.PL
      - name: make
        run: make
      - name: Run Tests (no coverage)
        if: ${{ !matrix.coverage }}
        run: make test
      - name: Run tests (with coverage)
        if: ${{ matrix.coverage }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cpanm -n Devel::Cover::Report::Coveralls
          cover -test \
            -ignore_re tomlc17.c \
            -ignore_re inline.h \
            -ignore_re easyxs \
            -ignore_re perlstatic.h \
            -report Coveralls

  funny-perl:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        perl-version:
          - '5.020.003'
          - '5.024.004'
          - '5.026.003'
          - '5.028.003'
          - '5.030.003'
          - '5.032.001'
        build-config:
          - main-longdouble-buster
          - main-quadmath-buster

    container:
      image: simcop2387/perl-tester:${{ matrix.perl-version }}-${{ matrix.build-config }}

    steps:
      - uses: actions/checkout@main
        with:
            submodules: recursive
      - run: perl -V
      - name: Tolerate EOL Debian Buster
        run: |
            for f in $(find /etc/apt -name '*.list'); do
                sed -i 's/deb.debian.org/archive.debian.org/g' "$f"
                sed -i 's/security.debian.org/archive.debian.org/g' "$f"
                sed -i '/buster-updates/d' "$f"
                sed -i '/buster-backports/d' "$f"
            done
      - run: cat /etc/apt/sources.list
      - run: apt update
      # NB: apt-installed cpanm runs a different perl.
      - run: apt install -y curl
      - run: curl -L https://cpanmin.us | perl - --notest --installdeps .
      - run: perl Makefile.PL
      - run: make
      - run: prove -wlvmb t

  alpine:
    runs-on: ubuntu-latest

    name: Alpine ${{ matrix.docker_arch }}

    strategy:
      fail-fast: false
      matrix:
        docker_arch:
        - i386
        - s390x
        - riscv64
        - ppc64le
        - amd64
        - armhf
        - arm/v7
        - aarch64

    steps:
      - uses: actions/checkout@v7
        with:
            submodules: recursive
      - name: Get the qemu container
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
      - name: Run tests
        run: docker run --rm --interactive --platform linux/${{ matrix.docker_arch }} --mount type=bind,source=$(pwd),target=/host alpine:latest sh -c "apk update && apk add bash curl wget perl perl-dev make git gcc musl-dev && perl -V && cd /host && curl -L https://cpanmin.us | perl - --notest --installdeps . && perl Makefile.PL && (make || make || make || make || make) && prove -wlvmb t"
